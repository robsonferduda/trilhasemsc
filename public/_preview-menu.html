<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-power.css">
</head>
<body class="pa-admin">
    <aside class="pa-sidebar">
        <a href="#" class="pa-brand"><span class="pa-logo"><i class="bi bi-lightning-charge-fill"></i></span><span class="pa-brand-text">Trilhas em SC</span></a>
        <nav class="pa-nav">

            <p class="pa-nav-label">Conteúdo</p>
            <a class="pa-nav-link" href="#"><i class="bi bi-map"></i><span>Trilhas</span></a>
            <a class="pa-nav-link" href="#"><i class="bi bi-plus-circle"></i><span>Nova trilha</span></a>
            <a class="pa-nav-link" href="#"><i class="bi bi-calendar-event"></i><span>Eventos</span></a>

        document.getElementById('pa-toggle').addEventListener('click', function () {
            document.body.classList.toggle('pa-collapsed');
        });
